<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bgGrad_03_retratos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a1a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <radialGradient id="vignette_03_retratos" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad_03_retratos)"/>
  <rect width="100%" height="100%" fill="url(#vignette_03_retratos)"/>

  <!-- Elegant Inner Border -->
  <rect x="24" y="24" width="752" height="1152" fill="none" stroke="rgba(224,219,212,0.12)" stroke-width="1"/>
  <rect x="30" y="30" width="740" height="1140" fill="none" stroke="#8b6914" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Top metadata -->
  <text x="48" y="64" font-family="'Inter', sans-serif" font-size="11" letter-spacing="3" fill="rgba(255,255,255,0.4)" text-transform="uppercase">WALDO LARGO</text>
  <text x="752" y="64" font-family="'Inter', sans-serif" font-size="11" letter-spacing="3" fill="#8b6914" text-anchor="end">RETRATOS</text>

  <!-- Center Content -->
  <g transform="translate(400, 600)">
    <!-- Camera/Aperture subtle icon -->
    <circle cx="0" cy="-60" r="28" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="-60" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle cx="0" cy="-60" r="4" fill="#8b6914"/>
    
    <!-- Title in Serif -->
    <text x="0" y="15" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#f5f0eb" text-anchor="middle">Vulnerabilidad</text>
    
    <!-- Placeholder indicator -->
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="11" letter-spacing="4" fill="rgba(255,255,255,0.45)" text-anchor="middle" text-transform="uppercase">FOTOGRAFÍA 03</text>
  </g>

  <!-- Bottom metadata -->
  <text x="48" y="1152" font-family="'Inter', sans-serif" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.3)">800 × 1200 PX</text>
  <text x="752" y="1152" font-family="'Inter', sans-serif" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.3)" text-anchor="end">PLACEHOLDER</text>
