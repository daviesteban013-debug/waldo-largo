      <stop offset="0%" stop-color="#282420"/>
      <stop offset="100%" stop-color="#181614"/>
    </linearGradient>
    <radialGradient id="vignette_04_estudio" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="transparent"/>
