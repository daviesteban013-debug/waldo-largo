    <!-- Camera/Aperture subtle icon -->
    <circle cx="0" cy="-60" r="28" fill="none" stroke="#c49a1c" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="-60" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
